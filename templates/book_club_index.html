<!DOCTYPE html>
<html lang="en">

<head>
    <title>Berlin Beer and Book Club</title>
    <!-- Site favicon -->
    <link rel="icon" type="image/x-icon" href="static/images/site_images/favicon.ico">
    <!-- Main style sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/main.css') }}">
    <!-- polaroid style sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/polaroid.css') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/read_google_sheet_data.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/details.js') }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="site-title">
            <div><img style="height: 100px;" src="static/images/site_images/BBandBCicons-transparent.png"></div>
            <div style="line-height: 2em;">
                <h1>Berlin Beer and Book Club</h1>
            </div>
            <div><img style="height: 100px;
  transform: scaleX(-1);" src="static/images/site_images/BBandBCicons-transparent.png"></div>
        </div>
        <div class="about">
        <h3>About</h3>
            <div class="blurb">
                <p>The website is for a book club set up by Max, Bethany and Helen on a holiday to Berlin in 2022.
                    We've read <span class="number-books">x</span> books so far.</p>
                <p>The next book will be picked by <span class="next-picker">x</span> in
                    <span class="next-date">x</span>.
                </p>
            <!--make this reveal when you click a camera emoji-->
            <div>
                <details id="polaroid_detail">
                    <summary>Click me!</summary>
                    <div class="polaroid" onclick="closeDetails()">
                        <img class="img-square" src="static/images/berlin-2022.jpg">
                        Berlin, 2022
                    </div>
                </details>
        </div>
    </header>
    <nav>
        <h3>Sort & filter books</h3>
        <div class="buttons-container">
            <div id="filters" class="button-group">
                <button class="button is-checked" data-filter="*">Show all books</button>
                <button class="button" data-filter=".Helen">Picked by Helen</button>
                <button class="button" data-filter=".Beth">Picked by Beth</button>
                <button class="button" data-filter=".Max, .alkaline-earth">Picked by Max</button>
            </div>
            <div id="sorts" class="button-group">
                <button class="button is-checked" data-sort-by="original-order">Original order</button>
                <button class="button" data-sort-by="title">Title (a-z)</button>
                <button class="button" data-sort-by="author">Author (a-z)</button>
                <button class="button" data-sort-by="year">Publication Year (old to new)</button>
                <button class="button" data-sort-by="average">Average rating (high to low)</button>
                <button class="button" data-sort-by="helen_rating">Helen's rating (high to low)</button>
                <button class="button" data-sort-by="max_rating">Max's rating (high to low)</button>
                <button class="button" data-sort-by="beth_rating">Beth's rating (high to low)</button>
            </div>
        </div>
    </nav>
    <main>

        <div class="book-container">

        </div>
    </main>
</body>

</html>
